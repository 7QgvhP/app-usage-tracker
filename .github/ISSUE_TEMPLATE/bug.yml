name: 不具合
description: 不具合を報告する（Claude が自動で修正します）
title: "[不具合] "
labels: ["claude:auto", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        このissueを作ると、PCが起動しているときに Claude が自動で対応します。
        情報が足りない場合は、Claude がこのissueに質問を書き込みます。返信すると作業が再開されます。
  - type: textarea
    id: symptom
    attributes:
      label: 症状
      description: 何が起きたか。エラーメッセージがあればそのまま貼ってください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 番号付きで、操作の順番を書いてください。
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
      description: 本来はどうなるべきか。
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 環境
      description: 任意。OS、バージョン、実行方法など。
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 補足（ログ・画面など）
      description: 任意。ログの抜粋や、画面のスクリーンショットがあれば。
    validations:
      required: false
